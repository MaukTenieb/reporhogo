# Search from a file: each push of queue.txt (one topic per line) runs Reporhogo in a real browser
# on every topic and writes results.md and results.json to the branch "result".
name: Search from a file
on:
  push:
    branches: [main]
    paths: ['queue.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run Reporhogo on each topic
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
          (python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 2
          mkdir -p /tmp/out && cd /tmp/out
          python3 "$GITHUB_WORKSPACE/.github/search/search.py" http://127.0.0.1:8000/index.html "$GITHUB_WORKSPACE/queue.txt"
      - name: Keep the results in the branch result
        run: |
          cd /tmp/out
          git init -q -b result
          git config user.name "reporhogo"; git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q origin result && git reset -q --soft origin/result || true
          git add results.md results.json
          git commit -qm "Reporhogo $(date -u +%FT%H%M)" || exit 0
          git push -q origin HEAD:result
